name: Monitor official benefit sources

on:
  schedule:
    # Monday 14:23 UTC. GitHub may delay scheduled runs.
    - cron: '23 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-compass-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.save.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public official pages and compare hashes
        run: node scripts/check-sources.mjs
      - name: Save source status only
        id: save
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/data/source-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh official source monitoring status"
            git push origin HEAD:"${{ github.event.repository.default_branch }}"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  # GITHUB_TOKEN commits do not trigger a new push workflow. Deploy explicitly.
  deploy-updated-status:
    needs: monitor
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.monitor.outputs.commit }}
